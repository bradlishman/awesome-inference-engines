name: Awesome list quality

on:
  push:
    paths:
      - README.md
      - contributing.md
      - historical.md
      - compatibility.md
      - bench/**
      - .github/workflows/awesome-lint.yml
  pull_request:
    paths:
      - README.md
      - contributing.md
      - historical.md
      - compatibility.md
      - bench/**
      - .github/workflows/awesome-lint.yml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes awesome-lint@2.3.0
      - run: python3 -m unittest discover -s bench -p 'test_*.py' -v
